version: '3.8'

services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: llm-monitor-php
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        networks:
            - llm-network

    nginx:
        image: nginx:1.25-alpine
        container_name: llm-monitor-nginx
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
        networks:
            - llm-network

networks:
    llm-network:
        driver: bridge